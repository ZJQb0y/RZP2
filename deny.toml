# cargo-deny 供应链审计配置。
#
# 用法:
#   cargo deny check advisories
#   cargo deny check licenses
#   cargo deny check bans
#
# RZP2 零运行时第三方依赖；本配置主要约束开发期依赖与 CI 依赖。

[advisories]
# 默认从 RustSec 数据库拉取安全通告；对无通告但已 yanked 的版本给出警告。
yanked = "warn"
ignore = []

[licenses]
# 允许的许可证：MIT / Apache-2.0（本项目双许可）以及常见的宽松许可证。
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Zlib",
]
# 对开发期依赖的许可证问题仅警告，不阻断（运行时零依赖才是硬约束）。
confidence-threshold = 0.8
exceptions = []

[bans]
# 禁止重复引入同一 crate 的多个版本；必要时可在此添加例外。
multiple-versions = "warn"
wildcards = "deny"
deny = []
skip = []

[sources]
# 仅允许 crates.io 与官方 git 源，避免来源不明的供应链。
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
